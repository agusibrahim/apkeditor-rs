[package]
name = "rsapkeditor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rsapksign"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
apk = "0.4.0"
clap = { version = "4.5.9", features = ["derive"], optional = true }
zip = { version = "2.1.3", default-features = false, features = ["constant_time_eq", "deflate"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# Dependencies for APK signing
xcommon = "0.3.0"
byteorder = "1.5"
sha2 = "0.10"
rsa = "0.7"
rasn = "0.6"
rasn-pkix = "0.6"
apk-info-axml = "1.0.9"
winnow = "0.6"
base64 = "0.22"
jks = { version = "0.3.3", default-features = false, features = ["wasm", "pkcs12"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
default = ["cli"]
cli = ["clap"]
wasm = ["wasm-bindgen", "js-sys", "web-sys", "serde", "serde-wasm-bindgen", "console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
